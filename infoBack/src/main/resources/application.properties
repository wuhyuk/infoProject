spring.application.name=infoBack

# Log encoding (UTF-8)
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# Policy news API log level
logging.level.com.example.infoBack.service.PolicyNewsService=INFO
server.port=8080

# Session cookie: SameSite=Lax is required so the JSESSIONID is sent when Google redirects back
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# MySQL Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:infodb}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.sql.init.mode=always

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# OAuth2 - Google
# Set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET as env vars (see .env.example)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 - Naver
# Set NAVER_CLIENT_ID / NAVER_CLIENT_SECRET as env vars, or replace the default values below
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# Frontend URL (used in CORS, redirects)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Frontend callback URL after OAuth2 success
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}

# Admin account (created on first startup if absent)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin}

# Welfare API (data.go.kr)
welfare.api.key=${WELFARE_API_KEY}

welfare.api.central-url=http://apis.data.go.kr/B554287/NationalWelfareInformationsV001/NationalWelfarelistV001
welfare.api.news-url=http://apis.data.go.kr/1371000/pressReleaseService/pressReleaseList
welfare.api.sync-cron=0 0 3 * * *
welfare.api.news-refresh-cron=0 0/30 * * * *
